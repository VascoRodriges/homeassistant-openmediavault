name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

jobs:
  release_zip:
    name: Build HACS release archive
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build integration archive
        working-directory: custom_components/openmediavault
        run: zip -r ../../openmediavault.zip ./

      - name: Upload integration archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" openmediavault.zip --clobber
