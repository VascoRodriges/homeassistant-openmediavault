name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release_zip:
    name: Build HACS release archive
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build integration archive
        working-directory: custom_components/openmediavault
        run: zip -r ../../../openmediavault.zip ./

      - name: Upload integration archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" openmediavault.zip --clobber
