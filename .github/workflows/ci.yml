name: CI

on:
  push:
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install quality tools
        run: python -m pip install --upgrade black flake8 bandit

      - name: Check formatting
        run: black --check --diff custom_components tests

      - name: Check Python syntax and imports
        run: |
          python -m compileall -q custom_components tests
          flake8 custom_components tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run security checks
        run: bandit -q -r custom_components/openmediavault -c .github/bandit.yaml

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
